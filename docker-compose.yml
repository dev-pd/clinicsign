# Optional: run the API in Docker locally. Postgres and S3 are NOT here — use AWS RDS + S3
# (provision with `pulumi up` in `infra/` and copy outputs into `.env`).
#
#   npm run docker:api
#
services:
  api:
    profiles:
      - docker-api
    image: clinicsign-api:local
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "4001:4000"
    env_file:
      - .env
    environment:
      PORT: "4000"
